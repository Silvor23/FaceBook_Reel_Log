<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <title>FRL</title>
  </head>
  <body>
    <p><a href="/addlog" class="button">Add reel</a></p>
    <p id="message"></p>
    <h2>FRL</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Date Of Published</th>
          <th>Year Of Event</th>
          <th>Media Origin</th>
          <th>Music</th>
          <th>Artist</th>
          <th>Reactions</th>
          <th>Views</th>
          <th>Follows</th>
          <th>Comments</th>
          <th>Subject</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script>
      const message = document.getElementById("message");
      const rows = document.getElementById("rows");
      async function loadRows() {
        const response = await fetch("/api/reels");
        const data = await response.json();
        rows.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${row.id}</td><td>${row.date_added}</td><td>${row.year}</td><td>${row.media_origin}</td>
          <td>${row.music}</td><td>${row.artist}</td><td>${row.reactions}</td><td>${row.view}</td><td>${row.follows}</td>
          <td>${row.comments}</td><td>${row.subject}</td><td>
  <button class="delete-btn" data-id="${row.id}">Delete</button>
  <button class="edit-btn" data-id="${row.id}">Edit</button>
</td>`;
          rows.appendChild(tr);
        });
      }
      rows.addEventListener('click', async (event) => {
  if (!event.target.classList.contains('delete-btn')) return;
  const id = event.target.dataset.id;
  if (!confirm('Delete reel ' + id + '?')) return;
  await fetch('/api/reels/' + id, { method: 'DELETE' });
  loadRows();
});
rows.addEventListener('click', async (event) => {
  const id = event.target.dataset.id;

  if (event.target.classList.contains('edit-btn')) {
    window.location.href = '/editlog?id=' + id;
  }

  if (event.target.classList.contains('delete-btn')) {
    if (!confirm('Delete reel ' + id + '?')) return;
    await fetch('/api/reels/' + id, { method: 'DELETE' });
    loadRows();
  }
});
      loadRows();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <title>Edit Reel</title>
  </head>
  <body>
    <p><a href="/" class="button">Home</a></p>
    <p id="message"></p>
    <h1>Edit Reel</h1>
    <form id="FRL">
      <p>
        <label for="date_added">Date:</label>
        <input type="date" id="date_added" required placeholder="dd.mm.yyyy" />
      </p>
      <p>
        <label for="year">Year Of Event:</label>
        <input type="number" id="year" required placeholder="yyyy" />
      </p>
      <p>
        <label for="media_origin">Media origin:</label>
        <select id="media_origin" required>
          <option value="">Choose...</option>
          <option value="AI">AI</option>
          <option value="Original">Original</option>
        </select>
      </p>
      <p>
        <label for="music">Music:</label>
        <input type="text" id="music" required placeholder="Music name" />
      </p>
      <p>
        <label for="artist">Artist:</label>
        <input type="text" id="artist" required placeholder="yyyy" />
      </p>
      <p>
        <label for="reactions">Reactions:</label>
        <input
          type="number"
          id="reactions"
          required
          placeholder="number of reactions"
        />
      </p>
      <p>
        <label for="view">Views:</label>
        <input type="number" id="view" required placeholder="number of views" />
      </p>
      <p>
        <label for="follows">Follows:</label>
        <input
          type="number"
          id="follows"
          required
          placeholder="number of follows"
        />
      </p>
      <p>
        <label for="comments">Comments:</label>
        <input
          type="number"
          id="comments"
          min="0"
          required
          placeholder="number of comments"
        />
      </p>
      <p>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" required placeholder="subject" />
      </p>
      <button type="submit">Update</button>
    </form>
    <script>
      const form = document.getElementById("FRL"); // use the id your form has
      const message = document.getElementById("message");
      const id = new URLSearchParams(window.location.search).get("id");
      const fields = [
        "date_added",
        "year",
        "media_origin",
        "music",
        "artist",
        "reactions",
        "view",
        "follows",
        "comments",
        "subject",
      ];
      const numberFields = ["year", "reactions", "view", "follows", "comments"];
      async function loadReel() {
        const response = await fetch("/api/reels/" + id);
        const data = await response.json();

        if (!response.ok) {
          message.textContent = "Error: " + data.error;
          return;
        }

        fields.forEach((f) => {
          document.getElementById(f).value = data[f];
        });
      }

      loadReel();
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = {
          date_added: document.getElementById("date_added").value,
          year: Number(document.getElementById("year").value),
          media_origin: document.getElementById("media_origin").value,
          music: document.getElementById("music").value,
          artist: document.getElementById("artist").value,
          reactions: Number(document.getElementById("reactions").value),
          view: Number(document.getElementById("view").value),
          follows: Number(document.getElementById("follows").value),
          comments: Number(document.getElementById("comments").value),
          subject: document.getElementById("subject").value,
        };

        const response = await fetch("/api/reels/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (response.ok) {
          window.location.href = "/";
        } else {
          message.textContent = "Error: :( " + data.error;
        }
      });
    </script>
  </body>
</html>
